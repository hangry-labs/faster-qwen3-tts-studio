version: '3'

dotenv: ['.env']

vars:
  IMAGE: faster-qwen3-tts-studio:dev
  CONTAINER: faster-qwen3-tts-studio
  DATA_VOLUME: faster_qwen3_tts_studio_data
  PORT: '7860'
  BIND_ADDRESS: '127.0.0.1'
  GPU_DEVICE: '0'
  DEV_MOUNT: '1'
  DRY_RUN: '0'
  ASR_URL: '{{.QWEN_STUDIO_ASR_URL | default ""}}'
  BENCHMARK_IMAGE: faster-qwen3-tts-studio:benchmark
  BENCHMARK_PORT: '8812'

env:
  QWEN_TASK_IMAGE: '{{.IMAGE}}'
  QWEN_TASK_CONTAINER: '{{.CONTAINER}}'
  QWEN_TASK_DATA_VOLUME: '{{.DATA_VOLUME}}'
  QWEN_TASK_PORT: '{{.PORT}}'
  QWEN_TASK_BIND_ADDRESS: '{{.BIND_ADDRESS}}'
  QWEN_TASK_GPU_DEVICE: '{{.GPU_DEVICE}}'
  QWEN_TASK_DEV_MOUNT: '{{.DEV_MOUNT}}'
  QWEN_TASK_DRY_RUN: '{{.DRY_RUN}}'
  QWEN_BENCHMARK_ASR_URL: '{{.ASR_URL}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  doctor:
    desc: Check PowerShell, uv, Docker Linux engine, and host NVIDIA GPUs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 doctor

  init:
    desc: Build the Python 3.13 NVIDIA development image and create its data volume
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 init

  start:
    desc: Start the UI/API with local source mounts and persistent model cache
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 start

  stop:
    desc: Stop this project's container, retaining its data and image
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 stop

  nuke:
    desc: Delete this project's container, development image, and ALL data in its volume
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 nuke

  logs:
    desc: Follow this project's container logs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 logs

  status:
    desc: Show this project's container state
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 status

  compile:
    desc: Check Python syntax without loading model dependencies
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python -m compileall -q src scripts benchmarks

  test:
    desc: Test task lifecycle, licensing and publication rules without GPU dependencies
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File tests/test_dev_tasks.ps1
      - uv run --no-project --python 3.13 --with 'pytest>=8,<10' python -m pytest tests/test_licensing.py tests/test_runtime_sources.py tests/test_ci_images.py tests/test_release.py tests/test_runtime_lock.py -q -p no:cacheprovider

  licenses:
    desc: Check source notices and licensing documentation
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python scripts/check_licensing.py

  sources:
    desc: Build the matching third-party source archive image without GPU inference
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - docker build --target sources -t faster-qwen3-tts-studio:sources .

  test-ui:
    desc: Check Generate drafts and audio replacement with Node's built-in test runner
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node --test tests/ui/*.test.mjs

  test-runtime:
    desc: Run CPU engine unit tests inside the development image without model downloads
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/dev.ps1 test-runtime

  smoke:
    desc: Generate real voice samples and check them with the configured ASR service
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python scripts/smoke_studio.py --base-url http://127.0.0.1:{{.PORT}} --asr-url "{{.ASR_URL}}" {{.CLI_ARGS}}

  examples:
    desc: Preview the static audio gallery at http://127.0.0.1:9000 without a GPU
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python -m http.server 9000 --bind 127.0.0.1 --directory examples

  pages-build:
    desc: Build the README website with the shared Hangry Labs theme
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/pages.ps1 build

  pages:
    desc: Preview the themed project website at http://127.0.0.1:9004/faster-qwen3-tts-studio/
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/pages.ps1 preview

  examples-generate:
    desc: Regenerate gallery audio through the running Studio, reusing completed samples
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - >-
        docker run --rm --network container:{{.CONTAINER}}
        --mount "type=bind,source={{.TASKFILE_DIR}},target=/workspace"
        --workdir /workspace --env PYTHONDONTWRITEBYTECODE=1
        {{.IMAGE}} python -m scripts.generate_gallery {{.CLI_ARGS}}

  validate:
    desc: Run syntax, lightweight tests, and source notice checks
    cmds:
      - task: compile
      - task: test
      - task: licenses

  benchmark-build:
    desc: Package the manual benchmark harness on the current local image (no inference)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - docker build --file benchmarks/Dockerfile --build-arg BASE_IMAGE={{.IMAGE}} --tag {{.BENCHMARK_IMAGE}} .

  benchmark-smoke:
    desc: Run product GPU smoke suites without publishing benchmark history
    cmds:
      - task: benchmark-baseline-smoke
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
      - task: benchmark-streaming-smoke
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
      - task: benchmark-ssml-smoke
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'
      - task: benchmark-queue-smoke
        vars:
          CLI_ARGS: '--clients 4 {{.CLI_ARGS}}'

  benchmark-plan:
    desc: Show the baseline workload and settings without Docker, network or GPU operations
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 python -m benchmarks.run_baseline --plan {{.CLI_ARGS}}

  benchmark-full:
    desc: Run Faster Qwen speed, memory, streaming, SSML and FIFO suites with one checkpoint resident at a time
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--suite full {{.CLI_ARGS}}'

  benchmark-preflight:
    desc: Check cached pinned weights offline without exposing a GPU or loading a model
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - >-
        docker run --rm --network none
        --mount type=volume,source={{.DATA_VOLUME}},target=/cache,readonly
        --env HF_HOME=/cache/huggingface --env HF_HUB_OFFLINE=1
        --entrypoint python {{.BENCHMARK_IMAGE}} -m benchmarks.preflight {{.CLI_ARGS}}

  benchmark-baseline:
    desc: Measure multilingual speed, GPU memory and ASR transcript fidelity on an isolated GPU
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - >-
        uv run --no-project --python 3.13 python -m benchmarks.run_baseline
        --native-image {{.BENCHMARK_IMAGE}} --faster-image {{.BENCHMARK_IMAGE}}
        --port {{.BENCHMARK_PORT}} --gpu-index {{.GPU_DEVICE}} --cache-volume {{.DATA_VOLUME}}
        --stop-container {{.CONTAINER}} {{.CLI_ARGS}}

  benchmark-baseline-smoke:
    desc: Real GPU English baseline wiring check, retaining evidence without publishing history
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--languages English --design-sentences 1 --repeats 1 --clone-repeats 1 --no-write {{.CLI_ARGS}}'

  benchmark-backends:
    desc: Run the four-scenario native versus Faster Qwen diagnostic comparison
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--suite backends --backends native,faster {{.CLI_ARGS}}'

  benchmark-backends-smoke:
    desc: Real GPU backend pilot wiring check without publishing history
    cmds:
      - task: benchmark-backends
        vars:
          CLI_ARGS: '--repeats 1 --clone-repeats 1 --no-write {{.CLI_ARGS}}'

  benchmark-streaming:
    desc: Measure first incremental audio and complete stream latency with staged ASR judging
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--suite streaming {{.CLI_ARGS}}'

  benchmark-streaming-smoke:
    desc: Real GPU English streaming check without publishing history
    cmds:
      - task: benchmark-streaming
        vars:
          CLI_ARGS: '--languages English --design-sentences 1 --repeats 1 --clone-repeats 1 --no-write {{.CLI_ARGS}}'

  benchmark-ssml:
    desc: Measure paired ten-turn standard SSML and SSML-H completion with remote ASR
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--suite ssml {{.CLI_ARGS}}'

  benchmark-ssml-smoke:
    desc: Real GPU single-round SSML wiring check without publishing history
    cmds:
      - task: benchmark-ssml
        vars:
          CLI_ARGS: '--rounds 1 --no-write {{.CLI_ARGS}}'

  benchmark-queue:
    desc: Compare sequential and FIFO-queued fixed-seed requests on one GPU worker
    cmds:
      - task: benchmark-baseline
        vars:
          CLI_ARGS: '--suite queue {{.CLI_ARGS}}'

  benchmark-queue-smoke:
    desc: Real GPU one-round queue wiring check without publishing history
    cmds:
      - task: benchmark-queue
        vars:
          CLI_ARGS: '--clients 2 --rounds 1 --no-write {{.CLI_ARGS}}'

  benchmark-queue-compare:
    desc: Validate matched before/after queue runs and generate their processing report
    cmds:
      - uv run --no-project --python 3.13 python scripts/compare_queue_runs.py {{.CLI_ARGS}}

  benchmark-queue-sustained:
    desc: Compare preserved images with continuously replenished four/eight-client load
    cmds:
      - >-
        uv run --no-project --python 3.13 python scripts/benchmark_sustained_queue.py
        --port {{.BENCHMARK_PORT}} --gpu-index {{.GPU_DEVICE}} --cache-volume {{.DATA_VOLUME}}
        --stop-container {{.CONTAINER}} {{.CLI_ARGS}}

  benchmark-test:
    desc: Check benchmark planning, transport, statistics and isolation without GPU inference
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run --no-project --python 3.13 --with 'pytest>=8,<10' python -m pytest tests/test_benchmarks.py tests/test_queue_comparison.py tests/test_sustained_queue.py tests/test_decoder_context_benchmark.py -q -p no:cacheprovider

  benchmark-decoder-context:
    desc: Compare warmed streaming context 25 vs 100 across cached checkpoints (Studio must be stopped)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File scripts/benchmark_decoder_context.ps1 {{.CLI_ARGS}}

  package:
    desc: Build local Python artifacts and verify their metadata and notices
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv build
      - pwsh -NoProfile -File scripts/check-packages.ps1

  release:
    desc: Promote a snapshot to a local release tag and prepare the next snapshot
    vars:
      NEXT_VERSION: '{{.NEXT_VERSION | default ""}}'
      SKIP_VALIDATION: '{{.SKIP_VALIDATION | default "0"}}'
    cmds:
      - pwsh -NoProfile -File scripts/release.ps1 -DryRun '{{.DRY_RUN}}' -NextVersion '{{.NEXT_VERSION}}' -SkipValidation '{{.SKIP_VALIDATION}}'

  lock-runtime:
    desc: Regenerate the CPython 3.13 NVIDIA runtime wheel-hash lock
    vars:
      CHECK: '{{.CHECK | default "0"}}'
    cmds:
      - pwsh -NoProfile -File scripts/lock-runtime.ps1 -Check '{{.CHECK}}'
