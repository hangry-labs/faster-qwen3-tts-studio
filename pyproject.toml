[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["faster_qwen3_tts*"]

[project]
name = "faster-qwen3-tts"
version = "0.5.4"
description = "Real-time Qwen3-TTS inference with CUDA graphs or GGML"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Andres Marafioti" }]
keywords = ["tts", "qwen", "cuda", "cudagraph", "ggml", "metal", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "qwen-tts-hf>=0.1.1.post1,<0.2",
    "transformers>=5.15.1,<6",
    "torch>=2.5.1",
    "numpy",
    "soundfile",
    "huggingface-hub>=1.5.0,<2.0",
    "qwentts-cpp-python>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
ggml = [
    "qwentts-cpp-python>=0.5.0",
]
demo = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.7",
    "huggingface-hub[oauth]>=1.5.0,<2.0",
]

[project.scripts]
faster-qwen3-tts = "faster_qwen3_tts.cli:main"

[project.urls]
Homepage = "https://github.com/andimarafioti/faster-qwen3-tts"
Repository = "https://github.com/andimarafioti/faster-qwen3-tts"
