name: Licensing notices

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - run: uv run --no-project --python 3.13 python scripts/check_licensing.py
      - run: uv run --no-project --python 3.13 python -m unittest discover -s tests -p test_licensing.py -v
      - run: uv build
      - run: uv run --no-project --python 3.13 python scripts/check_licensing.py --artifact dist/*.whl --artifact dist/*.tar.gz
