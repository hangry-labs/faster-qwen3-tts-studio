[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["faster_qwen3_tts*", "qwen_tts*"]

[project]
name = "faster-qwen3-tts"
version = "0.5.4"
description = "Hangry Labs Qwen3-TTS Studio with local model code and NVIDIA CUDA graph inference"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Andres Marafioti" }]
maintainers = [{ name = "Hangry Labs" }]
keywords = ["tts", "qwen", "cuda", "cudagraph", "streaming", "studio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "transformers>=5.15.1,<6",
    "torch>=2.10,<3",
    "accelerate>=1.12,<2",
    "librosa>=1,<2",
    "numpy",
    "soundfile",
    "huggingface-hub>=1.5.0,<2.0",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.7",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "ssml-h-tools==0.3.1",
    "defusedxml==0.7.1",
]
[project.scripts]
qwen3-tts-studio = "faster_qwen3_tts.standalone_ui.server:main"
faster-qwen3-tts = "faster_qwen3_tts.cli:main"

[project.urls]
Homepage = "https://github.com/hangry-labs/faster-qwen3-tts-studio"
Repository = "https://github.com/hangry-labs/faster-qwen3-tts-studio"
"Upstream sources" = "https://github.com/hangry-labs/faster-qwen3-tts-studio/blob/main/docs/UPSTREAMS.md"

[tool.setuptools.package-data]
"faster_qwen3_tts" = ["upstreams.toml"]
"faster_qwen3_tts.standalone_ui" = [
    "static/*.html", "static/*.css", "static/*.js", "static/locales/*.json",
    "static/vendor/lucide/*", "static/vendor/wavesurfer/*",
    "static/vendor/wavesurfer/plugins/*", "assets/*",
]
